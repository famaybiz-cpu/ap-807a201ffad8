<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7C1F5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Internado">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ic-180.png?v=2">
<title>Internado</title>
<style>
:root{--bg:#fbf3f1;--ink:#3a2230;--ink2:#7d6272;--line:#efd9dd;--rose:#d4708a;--rose2:#b9577a;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#1b1217;--ink:#f6e8ee;--ink2:#b99dab;--line:#3d2a35;--card:#2b1d26}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{display:grid;place-items:center;min-height:100vh;padding:24px;background:radial-gradient(900px 420px at 80% -10%,#f8e1e7,transparent 60%),var(--bg)}
.box{width:min(380px,100%);text-align:center}
.orn{color:#c39a5a;letter-spacing:6px;font-size:12px}
h1{font-family:ui-serif,"New York",Georgia,serif;font-weight:600;font-size:30px;margin:10px 0 18px;line-height:1.15}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px -12px rgba(185,87,122,.35)}
p{color:var(--ink2);font-size:13.5px;margin:0 0 12px}
input[type=password]{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;outline:none}
input[type=password]:focus{border-color:var(--rose)}
label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--ink2);margin:12px 0}
button{width:100%;padding:15px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;font:inherit;font-weight:600;font-size:17px}
#msg{color:#d9607a;margin:10px 0 0;min-height:18px}
</style>
</head>
<body>
<div class="box">
  <div class="orn">✿ ✿ ✿</div>
  <h1>Internado</h1>
  <div class="panel" id="f" hidden>
    <p>Contenido protegido. Escribe tu clave para abrirlo.</p>
    <input id="pw" type="password" placeholder="Clave" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    <button id="go">Abrir</button>
    <p id="msg"></p>
  </div>
  <p id="st">Abriendo…</p>
  <button id="rs" hidden style="margin-top:12px;background:#fff;color:#b9577a;border:1px solid #efd9dd">Reiniciar y reintentar</button>
</div>
<script>
"use strict";
const $=s=>document.getElementById(s);
const paso=t=>{$('st').textContent=t};
const con=(p,ms,n)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('tiempo agotado en: '+n)),ms))]);
async function reiniciar(){try{(await navigator.serviceWorker.getRegistrations()).forEach(r=>r.unregister());for(const k of await caches.keys())if(k.startsWith('ti-'))await caches.delete(k);
// Esperar a que el borrado termine: si queda pendiente, puede llevarse por
// delante la clave que se guarda justo después y la app no abre nunca.
await new Promise(ok=>{const r=indexedDB.deleteDatabase('ti_llave');r.onsuccess=r.onerror=r.onblocked=ok;setTimeout(ok,1500)});
sessionStorage.clear()}catch(e){}location.replace(location.pathname)}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('ti_llave',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function guardarLlave(k){const db=await idb();await new Promise((ok,no)=>{const t=db.transaction('k','readwrite');t.objectStore('k').put(k,'llave');t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)});db.close()}
// Darle la clave al servicio en mano: si el almacén del navegador no la guarda,
// el servicio igual puede descifrar mientras la pestaña siga abierta.
// En Safari el servicio abre el almacén pero no ve lo que guardó la página, así
// que la clave hay que ponérsela en la mano y ESPERAR que confirme. Si se abre
// la app sin esa confirmación, el servicio no puede descifrar, devuelve a la
// portada y se arma el bucle de «Reiniciar y reintentar».
async function avisarServicio(k){
  try{
    const reg=await con(navigator.serviceWorker.ready,4000,'avisar al servicio');
    const sw=reg.active||navigator.serviceWorker.controller;
    if(!sw)return false;
    return await new Promise(ok=>{
      const ch=new MessageChannel();
      ch.port1.onmessage=e=>ok(!!(e.data&&e.data.ok));
      setTimeout(()=>ok(false),3000);
      sw.postMessage({tipo:'llave',key:k},[ch.port2]);
    });
  }catch(e){return false}
}
async function leerLlave(){try{const db=await idb();return await new Promise(ok=>{const g=db.transaction('k').objectStore('k').get('llave');g.onsuccess=()=>ok(g.result||null);g.onerror=()=>ok(null)})}catch(e){return null}}
async function verifica(key,meta){
  const buf=b64(meta.chk);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
  return new TextDecoder().decode(pt)==='ok';
}
async function derivar(pass,meta){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass.trim().toLowerCase()),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(meta.s),iterations:meta.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function entrar(meta){
  const n=+(sessionStorage.getItem('ti_n')||0)+1;sessionStorage.setItem('ti_n',n);
  if(n>2){paso('La app no pudo abrirse desde aquí. Toca Reiniciar y reintentar.');$('rs').hidden=false;return}
  $('st').textContent='Preparando para usar sin internet…';
  if(!navigator.serviceWorker.controller){
    await Promise.race([new Promise(r=>navigator.serviceWorker.addEventListener('controllerchange',r,{once:true})),new Promise(r=>setTimeout(r,4000))]);
  }
  await con(Promise.all((meta.core||[]).map(p=>fetch('app/'+p).catch(()=>{}))),20000,'guardar para uso sin internet').catch(()=>{});
  // Última comprobación antes de abrir: que el servicio pueda descifrar de
  // verdad. Si no, avisar en vez de entrar en bucle.
  try{
    const r=await con(fetch('app/index.html',{redirect:'manual'}),8000,'probar la app');
    if(r.type==='opaqueredirect'||r.status===403){
      paso('Safari no le está pasando la clave al servicio. Abre la app en Chrome, o toca Reiniciar y reintentar.');
      $('rs').hidden=false;return;
    }
  }catch(e){}
  // Si llegó por un enlace directo (p. ej. .../app/reproductor/), el 404 guardó
  // a dónde iba: ahora que el servicio ya manda, se abre ahí y no en la portada.
  let destino='app/index.html';
  try{const d=sessionStorage.getItem('ti_destino');sessionStorage.removeItem('ti_destino');
      if(d&&d.indexOf('/app/')>-1)destino=d}catch(e){}
  location.replace(destino);
}
(async()=>{
  $('rs').onclick=reiniciar;
  try{
  if(!window.crypto||!crypto.subtle||!('serviceWorker' in navigator)){paso('Este navegador no es compatible (falta cifrado o service worker).');$('rs').hidden=false;return}
  paso('Abriendo… (1/4)');
  const meta=await con(fetch('meta.json',{cache:'no-store'}).then(r=>r.json()),10000,'leer meta.json');
  paso('Abriendo… (2/4)');
  await con(navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}),10000,'registrar el servicio');
  await con(navigator.serviceWorker.ready,10000,'activar el servicio');
  paso('Abriendo… (3/4)');
  const k=await con(leerLlave(),5000,'leer la clave guardada');
  if(k){try{if(await verifica(k,meta)){await avisarServicio(k);return entrar(meta)}}catch(e){}}
  window.__meta=meta;
  $('st').hidden=true;$('f').hidden=false;
  }catch(e){paso('No pude abrir: '+(e&&e.message||e));$('rs').hidden=false;return}
  const meta=window.__meta;
  $('st').hidden=true;$('f').hidden=false;
  const go=async()=>{
    $('msg').textContent='';
    let key;
    try{
      key=await derivar($('pw').value,meta);
      if(!(await verifica(key,meta)))throw 0;
    }catch(e){$('msg').textContent='Clave incorrecta';return}
    // Si el almacén falla, no es culpa de la clave: se sigue igual, con la
    // clave en mano del servicio. Antes esto salía como «Clave incorrecta».
    try{await guardarLlave(key)}catch(e){}
    await avisarServicio(key);
    $('f').hidden=true;$('st').hidden=false;entrar(meta);
  };
  $('go').onclick=go;$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
})();
</script>
</body>
</html>
